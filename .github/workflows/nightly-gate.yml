name: Nightly gate

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

concurrency:
  group: nightly-gate
  cancel-in-progress: false

jobs:
  gate:
    # Nightly health: the package builds, the hermetic tests pass, and every
    # catalog entry still carries a valid revision pin. The end-to-end
    # download→generate check lives in next-sdk-gate.yml — it exercises the
    # strict next-SDK loader path and is tracked separately so its red (a
    # migration tracker, not a user-facing breakage) doesn't mask this gate.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode-27.0.0-Beta.5.app
    steps:
      - uses: actions/checkout@v4
      - name: The pinned Xcode is installed
        # First thing that breaks when a beta is replaced on the runner. Say so
        # in one line instead of letting every later step fail on `xcrun`.
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR is not installed on this runner." \
                 "Install that beta, or point DEVELOPER_DIR at the one that is" \
                 "(.github/workflows/*.yml all pin the same path)."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Catalog pins present
        run: python3 scripts/pin-catalog.py --check
      - name: Built-in fallback carries the same pins
        run: python3 scripts/gen-builtin-pins.py --check
