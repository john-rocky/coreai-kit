name: Next-SDK model gate

on:
  schedule:
    - cron: "30 18 * * *" # 03:30 JST, after the nightly gate
  workflow_dispatch:

concurrency:
  group: next-sdk-gate
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  gate:
    # Tracks whether the PUBLISHED model artifacts load under the NEXT SDK
    # generation. Binaries linked against the Xcode 27 beta 3+ SDK take the
    # CoreAI loader's strict versioned-IR path, which rejects every bundle
    # exported with coreai-core <1.0.0b2:
    #   "expected AICode versioned location" -> "Failed to convert to
    #   versioned IR" -> LLVM ERROR (process crash). (FB23666783, 2026-07-10.)
    #
    # "pre-b2 rejected" means "published bundles are not next-SDK-ready yet" —
    # apps built with earlier SDKs load them fine, so this is a migration
    # tracker, not a user-facing breakage. It flips to "compatible" when either
    # (a) Apple ships a legacy-IR compatibility path in a later beta, or
    # (b) the zoo is re-exported with coreai-core >=1.0.0b2 and the catalog
    # pins are bumped.
    #
    # The run itself stays green in steady state — the status lives as a badge
    # JSON on the `gate-status` branch, and a STATE FLIP opens an issue. That
    # way a known-migrating state doesn't send a failure mail every night, and
    # the moment the state changes (e.g. a beta fixes FB23666783) is loud.
    #
    # A verdict is only ever written when the probe actually reached the loader.
    # Anything else — a missing Xcode, a broken toolchain, a failed download —
    # is INCONCLUSIVE: the run goes red and the badge is left alone. Folding
    # infrastructure failure into "not-ready" published a false red on
    # 2026-08-15, when DEVELOPER_DIR pointed at an uninstalled beta and the
    # probe never ran at all.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode-27.0.0-Beta.5.app
    steps:
      - uses: actions/checkout@v4
      - name: The pinned Xcode is installed
        # First thing that breaks when a beta is replaced on the runner. Say so
        # in one line instead of letting every later step fail on `xcrun`.
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR is not installed on this runner." \
                 "Install that beta, or point DEVELOPER_DIR at the one that is" \
                 "(.github/workflows/*.yml all pin the same path)."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          swift --version
      # What this probe can and cannot detect, as of 2026-08-17. It loads the
      # catalog's pinned qwen3-0.6b, and that pin has named a RESCUED bundle
      # since 2026-07-21 — `producer: coreai-core 1.0.0b2`, created 04:16Z that
      # day, which is the strip_debug_info recovery. A b2 bundle loads under
      # any SDK, so `ready` is the only verdict reachable by measurement and
      # the red state has been unreachable since that pin bump. What the badge
      # actually reports is "the published catalog still loads under the next
      # SDK" — worth knowing nightly — and not "pre-b2 exports are rejected",
      # which is what its label says. Answering the label's question needs an
      # unrescued 0.4.0-IR bundle kept as a fixture.
      #
      # The general shape: bumping a pin underneath a gate silently changes
      # what the gate measures, and a gate that can no longer fail looks
      # exactly like a gate that is passing.
      - name: Probe a pinned catalog model under the beta 5 SDK loader
        id: probe
        # Serialized on the machine-wide GPU lock — the macOS 27 beta driver
        # panics under parallel GPU load.
        run: |
          set -o pipefail
          cd Examples/ChatDemo
          rc=0
          python3 ../../scripts/with-gpu-lock.py -- \
            swift run chat-cli --model qwen3-0.6b --prompt "Reply with one short sentence: what are you?" \
            2>&1 | tee /tmp/next-sdk-gate.out || rc=$?

          # Exits non-zero, writing no status, when the run said nothing about
          # the models. Failing here skips the publish step below, so the
          # badge keeps whatever it last said. See scripts/classify-probe.sh.
          if STATUS=$(../../scripts/classify-probe.sh /tmp/next-sdk-gate.out "$rc"); then
            echo "$STATUS" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The probe said nothing about the models (reason above)." \
                 "Treating this as an infrastructure failure: the badge is left" \
                 "untouched. Fix the runner and re-dispatch."
            exit 1
          fi
      - name: Publish status badge, open an issue on state change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="${{ steps.probe.outputs.status }}"
          if [ "$STATUS" = "ready" ]; then
            MSG="compatible"; COLOR="brightgreen"
          else
            MSG="pre-b2 rejected (FB23666783)"; COLOR="red"
          fi
          FILE=$(gh api "repos/${{ github.repository }}/contents/next-sdk.json?ref=gate-status" 2>/dev/null || true)
          PREV_MSG=$(printf '%s' "$FILE" | python3 -c 'import base64,json,sys; d=json.load(sys.stdin); print(json.loads(base64.b64decode(d["content"]))["message"])' 2>/dev/null || echo "")
          SHA=$(printf '%s' "$FILE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' 2>/dev/null || echo "")
          if [ "$PREV_MSG" = "$MSG" ]; then
            echo "state unchanged: $MSG"
            exit 0
          fi

          # Announce before recording. If the issue can't be filed, the badge
          # keeps its old value and the next run retries the whole flip —
          # rather than banking the new state and silently never notifying.
          TITLE="Next-SDK model gate: ${PREV_MSG:-unknown} -> $MSG"
          BODY=$(printf 'The strict (beta 5 SDK) loader probe changed state: **%s -> %s**.\n\nRun: %s\nContext: FB23666783 — pre-b2 `.aimodel` exports are rejected by the versioned-IR loader.\nIf this flipped to *compatible* on a new beta, verify whether Apple shipped a legacy-IR path; if it flipped back to *rejected*, a re-export or OS change regressed.' \
            "${PREV_MSG:-unknown}" "$MSG" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          DUP=$(gh issue list --repo "${{ github.repository }}" --state open --search "$TITLE in:title" \
                  --json title,number --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty" 2>/dev/null || echo "")
          if [ -n "$DUP" ]; then
            echo "an open issue already tracks this flip: #$DUP"
            gh issue comment "$DUP" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

          NEW=$(MSG="$MSG" COLOR="$COLOR" python3 -c 'import json,os; print(json.dumps({"schemaVersion":1,"label":"next-SDK models","message":os.environ["MSG"],"color":os.environ["COLOR"]}))')
          gh api -X PUT "repos/${{ github.repository }}/contents/next-sdk.json" \
            -f branch=gate-status \
            -f message="next-sdk status: $MSG" \
            -f content="$(printf '%s' "$NEW" | base64)" \
            ${SHA:+-f sha=$SHA}
