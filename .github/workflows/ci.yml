name: CI

on:
  push:
    branches: [main]
    # This job runs on a self-hosted Apple silicon machine that is also used for conversions and
    # for energy and throughput measurements, where a concurrent build shows up in the numbers.
    # A documentation-only change cannot affect `swift build` or `swift test`, so it must not
    # occupy that machine. Anything touching code, the manifest, the catalog or CI itself still
    # runs — the list below is only files with no bearing on the build.
    paths-ignore:
      - "**/*.md"
      - "llms.txt"
      - "_config.yml"
      - "docs/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Self-hosted: the CoreAI framework needs macOS 27 beta, which no hosted runner
    # image carries. The Xcode is named once in .xcode-pin — its SDK must match the
    # installed OS build, or the test bundle fails to dlopen FoundationModels.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The pinned Xcode is the one being used
        # Sets DEVELOPER_DIR for every later step from .xcode-pin, and refuses to
        # continue unless that Xcode is installed, is the build the pin names, and
        # has not been superseded by a release build of the same train. The old
        # check tested `[ -d ]` alone, which cannot go red at GA: the release Xcode
        # lands in /Applications/Xcode.app and the beta stays put.
        run: ./scripts/check-xcode-pin.sh
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Catalog pins present
        run: python3 scripts/pin-catalog.py --check
      - name: Built-in fallback carries the same pins
        # The offline fallback is what ships when the catalog fetch fails; an unpinned entry
        # there downloads from the model repo's main branch instead of the reviewed bytes.
        run: python3 scripts/gen-builtin-pins.py --check
      - name: Docs agree with the catalog
        run: python3 scripts/check-doc-counts.py
      - name: Probe classification holds
        # The next-SDK gate's verdict logic; it published a false red once.
        run: ./scripts/test-classify-probe.sh
      - name: Xcode pin logic holds
        # The gate that decides which SDK every other job trusts. Its GA case
        # cannot be exercised until GA, so it is exercised against fixtures.
        run: ./scripts/test-check-xcode-pin.sh
      - name: The prepared GA wording edit still applies
        # Seven sentences say "beta" and stop being true on the day 27 ships.
        # The edit is written; this fails if someone rewords a line underneath
        # it, so it goes stale here rather than on the morning it is needed.
        run: python3 scripts/ga-wording.py --check
      - name: llms.txt lists every example
        run: python3 scripts/gen_llms_txt.py --check
