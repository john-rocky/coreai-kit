name: ActionCamera
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../..

schemes:
  ActionCamera:
    build:
      targets:
        ActionCamera: all
    run:
      config: Release

targets:
  ActionCamera:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
    dependencies:
      - package: coreai-kit
        product: CoreAIKitVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.actioncamera
        DEVELOPMENT_TEAM: MFN25KNUGJ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "ActionCamera names what you're doing from the live camera, fully on-device."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
