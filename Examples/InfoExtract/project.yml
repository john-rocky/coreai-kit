name: InfoExtract
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../..

schemes:
  InfoExtract:
    build:
      targets:
        InfoExtract: all
    run:
      config: Release

targets:
  InfoExtract:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App
    dependencies:
      - package: coreai-kit
        product: CoreAIKitEmbeddings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.infoextract
        DEVELOPMENT_TEAM: MFN25KNUGJ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
