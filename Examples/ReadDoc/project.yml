name: ReadDoc
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../..

# Release: the decoder's per-token host work is ~3x slower unoptimized.
schemes:
  ReadDoc:
    build:
      targets:
        ReadDoc: all
    run:
      config: Release

targets:
  ReadDoc:
    type: application
    # The shipped bundle is macOS-only today (3.4 GB JIT decoder); iOS needs an AOT export.
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources
    dependencies:
      - package: coreai-kit
        product: CoreAIKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.readdoc
        DEVELOPMENT_TEAM: MFN25KNUGJ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
