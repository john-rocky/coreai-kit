name: ScanToType
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../..

schemes:
  ScanToType:
    build:
      targets:
        ScanToType: all
    run:
      config: Release

targets:
  ScanToType:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App
      - path: Sources
    dependencies:
      - package: coreai-kit
        product: CoreAIOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.scantotype
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Pick a receipt photo to read on device.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
