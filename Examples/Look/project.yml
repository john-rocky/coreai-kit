name: Look
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../..

# Run config Release: the engine's per-token host work is ~3x slower unoptimized, and the
# numbers line on screen reports what this build measures.
schemes:
  Look:
    build:
      targets:
        Look: all
    run:
      config: Release

targets:
  Look:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources
      # The three example photos, as a folder in the app bundle (Look.app/Examples/). They are
      # not in the repository (README: Run it); the folder is, so the project builds without them.
      - path: Examples
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: coreai-kit
        product: CoreAIKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.look
        # Resolves from your shell: `export DEVELOPMENT_TEAM=XXXXXXXXXX` before `xcodegen generate`,
        # or leave unset and pick your team in Xcode’s Signing & Capabilities tab.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        # The vision tower specializes beside the resident decoder — needs the increased memory limit.
        CODE_SIGN_ENTITLEMENTS: Look.entitlements
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Look sends a photo you choose to a vision-language model that runs fully on-device. Nothing leaves your device."
        INFOPLIST_KEY_NSCameraUsageDescription: "Look takes a photo for a vision-language model that runs fully on-device. Nothing leaves your device."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
