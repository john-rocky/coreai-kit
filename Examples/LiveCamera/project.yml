name: LiveCamera
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../..

schemes:
  LiveCamera:
    build:
      targets:
        LiveCamera: all
    run:
      config: Release

targets:
  LiveCamera:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
    dependencies:
      - package: coreai-kit
        product: CoreAIOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.livecamera
        # Resolves from your shell: `export DEVELOPMENT_TEAM=XXXXXXXXXX` before
        # `xcodegen generate`, or leave unset and pick your team in Xcode's Signing tab.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "LiveCamera runs detection and depth models on the live camera, fully on-device."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "LiveCamera scans a video you choose, fully on-device."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        # A VLM caption on the Trigger tab is a multi-gigabyte resident model beside a live
        # capture session; without the entitlement the app is jetsammed before it answers.
        CODE_SIGN_ENTITLEMENTS: LiveCamera.entitlements
