name: Decide
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../..

# Release: measure there — Debug is ~3x slower on the per-token host work.
schemes:
  Decide:
    build:
      targets:
        Decide: all
    run:
      config: Release

targets:
  Decide:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources
    dependencies:
      - package: coreai-kit
        product: CoreAIOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.decide
        # Resolves from your shell: `export DEVELOPMENT_TEAM=XXXXXXXXXX` before `xcodegen generate`,
        # or leave unset and pick your team in Xcode’s Signing & Capabilities tab.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Decide.entitlements
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Decide records audio only to transcribe it on device and decide, per sentence, whether it needs a reply. Nothing leaves your device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Decide transcribes your recording with the on-device speech recognizer."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
