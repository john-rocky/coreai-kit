name: VLChat
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../..

# Run config Release: the engine's per-token host work is ~3x slower unoptimized.
schemes:
  VLChat:
    build:
      targets:
        VLChat: all
    run:
      config: Release

targets:
  VLChat:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources
    dependencies:
      - package: coreai-kit
        product: CoreAIKit
      - package: coreai-kit
        product: CoreAIKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.vlchat
        # Resolves from your shell: `export DEVELOPMENT_TEAM=XXXXXXXXXX` before `xcodegen generate`,
        # or leave unset and pick your team in Xcode’s Signing & Capabilities tab.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "VLChat sends a photo you choose to a local vision-language model on this device to describe it. Nothing leaves your device."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
