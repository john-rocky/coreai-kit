name: PhotoSearch
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../..

schemes:
  PhotoSearch:
    build:
      targets:
        PhotoSearch: all
    run:
      config: Release

targets:
  PhotoSearch:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
    dependencies:
      - package: coreai-kit
        product: CoreAIKitVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.photosearch
        # Resolves from your shell: `export DEVELOPMENT_TEAM=XXXXXXXXXX` before `xcodegen generate`,
        # or leave unset and pick your team in Xcode’s Signing & Capabilities tab.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PhotoSearch indexes your photos on-device to enable semantic search. Nothing leaves your iPhone."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
