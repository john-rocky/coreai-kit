name: ChatDemo
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../..

# Run config Release: the engine's per-token host work is ~3x slower unoptimized.
schemes:
  ChatDemo:
    build:
      targets:
        ChatDemo: all
    run:
      config: Release

targets:
  ChatDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources
    dependencies:
      - package: coreai-kit
        product: CoreAIKit
      - package: coreai-kit
        product: CoreAIKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.chatdemo
        DEVELOPMENT_TEAM: MFN25KNUGJ
        CODE_SIGN_STYLE: Automatic
        # Gemma 4 E2B peaks ~4.45 GB on iPhone — needs the increased memory limit.
        CODE_SIGN_ENTITLEMENTS: ChatDemo.entitlements
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        # Without a launch screen iOS runs the app letterboxed (black bars top/bottom).
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
