name: AskVLM
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../..

schemes:
  AskVLM:
    build:
      targets:
        AskVLM: all
    run:
      config: Release

targets:
  AskVLM:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources
    dependencies:
      # CoreAIKit brings the VL executor (`KitVisionModel`). This app has no CV models — the whole
      # Visual Intelligence surface is the on-device VLM.
      - package: coreai-kit
        product: CoreAIKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.askvlm
        # Resolves from your shell: `export DEVELOPMENT_TEAM=XXXXXXXXXX` before `xcodegen generate`,
        # or leave unset and pick your team in Xcode’s Signing & Capabilities tab.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        # The user-facing name = the label of our tab in the system Visual Intelligence UI.
        INFOPLIST_KEY_CFBundleDisplayName: "Qwen3-VL"
        INFOPLIST_KEY_CFBundleName: "Qwen3-VL"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        # macOS: the system CoreAI framework + on-device model cache need file access.
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
