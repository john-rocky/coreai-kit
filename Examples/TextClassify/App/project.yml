name: TextClassify
options:
  bundleIdPrefix: com.coreaikit
  createIntermediateGroups: true

packages:
  coreai-kit:
    path: ../../..

# Release: the numbers on screen are measured, and Debug adds host overhead to every message.
schemes:
  TextClassify:
    build:
      targets:
        TextClassify: all
    run:
      config: Release

targets:
  TextClassify:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources
      # The inbox and the sorter — compiled into the app and also built standalone by
      # ../Package.swift for `swift run textclassify-cli --inbox`.
      - path: ../Sources/InboxCore
    dependencies:
      - package: coreai-kit
        product: CoreAIKitEmbeddings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreaikit.textclassify
        # Resolves from your shell: `export DEVELOPMENT_TEAM=XXXXXXXXXX` before `xcodegen generate`,
        # or leave unset and pick your team in Xcode’s Signing & Capabilities tab.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # The inbox is a portrait screen on iPhone.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        # macOS: `-bundle <dir>` reads a model directory anywhere on disk.
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
